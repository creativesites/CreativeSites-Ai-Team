[package]
name = "myaos-desktop-v2"
version = "0.1.0"
description = "MyaOS Desktop v2: window, runtime sidecar and OS integration. Data comes from the runtime's API."
authors = ["CreativeSites AI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
keyring = { version = "3", features = ["apple-native"] }
